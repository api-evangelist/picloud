name: PiCloud
description: PiCloud was a cloud-computing startup founded in 2009 that offered a pay-as-you-go,
  serverless platform for running Python workloads across public (AWS) and private clouds
  without provisioning, configuring, or managing virtual servers — popular for batch processing,
  high-performance computing, and scientific computing. It raised a seed round from Andreessen
  Horowitz (a16z), Kleiner Perkins, Plug and Play, and Greylock. The team was acquired by Dropbox
  in November 2013 and the PiCloud service was shut down on February 25, 2014 (its platform lived
  on briefly as the open-source Multyvac project). The picloud.com domain is now parked, and there
  is no live API, developer portal, or documentation to enrich.
